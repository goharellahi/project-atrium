# ---------------------------------------------------------------------------
# Render blueprint — API only.
#
# Zero cost is a hard requirement of the brief. Everything here is on a free
# plan and needs no card. The web frontend goes to Vercel (see apps/web/vercel.json),
# because Render's free static hosting has no Next.js SSR.
#
# WHAT THIS DEPLOYMENT IS NOT.
# It runs ONE API instance. The three-replica configuration exists only in
# docker compose locally, which is where the concurrency proof runs. That is by
# design and matches the brief's split: "Deployment proves you can ship. The
# local benchmark proves the design is sound."
#
# The correctness argument does not depend on replica count anyway — both
# mechanisms are enforced by Postgres, not by application memory. A single
# free instance is not a weaker guarantee, just a smaller one.
#
# Free-tier caveats, stated because the reviewer will hit them:
#   - the service sleeps after 15 minutes idle; first request takes 30-60s
#   - 512 MB RAM / 0.1 CPU, which is why argon2 is tuned to 19 MiB per hash
#   - Render free Postgres expires after 30 days
#   - no pre-deploy hooks, no shell access: migrations run in the start command
# ---------------------------------------------------------------------------
databases:
  - name: atrium-db
    plan: free
    databaseName: atrium
    user: atrium
    postgresMajorVersion: "16"

services:
  - type: web
    name: atrium-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Migrations run as part of the container command, NOT via preDeployCommand.
    #
    # preDeployCommand is a paid-tier feature; a free service is rejected at
    # blueprint validation with "pre-deploy command is not supported for free
    # tier services". Chaining into the start command is the free-tier
    # equivalent and has the same ordering guarantee: the server never binds
    # until migrations have succeeded, and a failed migration exits non-zero so
    # the deploy fails instead of serving against a stale schema.
    #
    # Safe here only because this service runs a single instance. Three replicas
    # each running this on boot would race; that is why docker-compose keeps the
    # separate one-shot `migrate` service instead. If numInstances ever rises
    # above 1, this must move back to a pre-deploy step or a one-shot job.
    #
    # Note this also re-runs on every cold start after the free tier sleeps.
    # Applied migrations are recorded in drizzle's journal, so the re-run is two
    # queries and a no-op — it adds a little to the 30-60s wake time, nothing more.
    dockerCommand: sh -c "node dist/db/migrate.js && node dist/main.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3001"
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      - key: REPLICA_ID
        value: render-1
      - key: DATABASE_URL
        fromDatabase:
          name: atrium-db
          property: connectionString
      # Generated by Render on first deploy, never committed.
      - key: JWT_SECRET
        generateValue: true
      - key: PAYGATE_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: HOLD_TTL_SECONDS
        value: "480"
      - key: CHECKOUT_REARM_SECONDS
        value: "600"
      - key: MAX_HOLD_REARMS
        value: "2"
      - key: MAX_HOLD_LIFETIME_SECONDS
        value: "1800"
      - key: ROOM_TURNAROUND_MINUTES
        value: "15"
