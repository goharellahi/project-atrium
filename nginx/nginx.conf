# ---------------------------------------------------------------------------
# Atrium load balancer.
#
# Every invariant in the brief must hold with requests distributed across all
# three API replicas. This config is what makes that true locally: the
# concurrency proof and the k6 scripts both talk to :8080, never to a replica
# directly.
#
# Round robin is nginx's default and is what we want here — we are trying to
# spread the 200 concurrent hold requests across replicas as evenly as
# possible, because a strategy that only holds inside one process must be
# given every chance to fail.  Explicitly NOT ip_hash or least_conn: ip_hash
# would pin the whole concurrency proof to a single replica and hide exactly
# the bug we are testing for.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Correlation id: generated here if the client did not supply one, then
    # passed down. The API propagates it into the Paygate call and back through
    # the webhook path, so one booking is traceable end to end (Tier 2).
    map $http_x_request_id $atrium_request_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format atrium '$remote_addr $request_id "$request" '
                      'status=$status upstream=$upstream_addr '
                      'rt=$request_time urt=$upstream_response_time '
                      'rid=$atrium_request_id';

    access_log /var/log/nginx/access.log atrium;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    upstream atrium_api {
        # Round robin, no weights. All three replicas are the identical image.
        server api1:3001 max_fails=3 fail_timeout=10s;
        server api2:3001 max_fails=3 fail_timeout=10s;
        server api3:3001 max_fails=3 fail_timeout=10s;

        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        # nginx's own liveness, so the container healthcheck does not depend on
        # the API being up.
        location = /lb-health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location / {
            proxy_pass http://atrium_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $atrium_request_id;

            # Surface which replica served the request. The concurrency proof
            # reads this to show the 200 requests really were distributed.
            add_header X-Upstream $upstream_addr always;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Do NOT retry a failed hold against the next replica. A retried
            # POST is a second booking attempt, and an idempotent-looking
            # retry here would quietly undermine INV-3.
            proxy_next_upstream off;
        }
    }
}
