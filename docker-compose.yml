# ---------------------------------------------------------------------------
# Atrium — full local stack.
#
# `docker compose up` must stand up three API replicas behind a load balancer,
# not one (brief §08). Every invariant is tested in this configuration.
#
# api1/api2/api3 share one image tag, so the image is built once and the three
# replicas are byte-identical. They differ only in REPLICA_ID, which is used
# for logging so the concurrency proof can show requests really did spread.
# ---------------------------------------------------------------------------

name: atrium

x-api-base: &api-base
  image: atrium-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  environment: &api-env
    NODE_ENV: ${NODE_ENV:-development}
    API_PORT: 3001
    DATABASE_URL: postgres://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:-atrium}@postgres:5432/${POSTGRES_DB:-atrium}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-real-secret}
    HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-480}
    CHECKOUT_REARM_SECONDS: ${CHECKOUT_REARM_SECONDS:-600}
    MAX_HOLD_REARMS: ${MAX_HOLD_REARMS:-2}
    MAX_HOLD_LIFETIME_SECONDS: ${MAX_HOLD_LIFETIME_SECONDS:-1800}
    ROOM_TURNAROUND_MINUTES: ${ROOM_TURNAROUND_MINUTES:-15}
    HOLD_SWEEPER_INTERVAL_SECONDS: ${HOLD_SWEEPER_INTERVAL_SECONDS:-15}
    PAYGATE_BASE_URL: http://paygate:9000
    PAYGATE_SECRET: ${PAYGATE_SECRET:-dev-paygate-hmac-secret}
    PAYGATE_TIMEOUT_MS: ${PAYGATE_TIMEOUT_MS:-8000}
    WEBHOOK_DRAIN_INTERVAL_SECONDS: ${WEBHOOK_DRAIN_INTERVAL_SECONDS:-10}
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s
  networks: [atrium]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrium}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
      # Deterministic timezone. Slots are tstzrange; a surprise local timezone
      # on the server would silently shift every interval comparison.
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # The full profile is 250k bookings against a gist exclusion constraint.
      # These are modest but deliberate: the default 128MB shared_buffers makes
      # the benchmark measure the wrong thing.
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atrium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atrium} -d ${POSTGRES_DB:-atrium}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [atrium]

  # One-shot. Runs to completion before any replica starts, so three replicas do
  # not race each other applying the same migrations.
  migrate:
    image: atrium-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: atrium-migrate
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:-atrium}@postgres:5432/${POSTGRES_DB:-atrium}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [atrium]

  api1:
    <<: *api-base
    container_name: atrium-api1
    environment:
      <<: *api-env
      REPLICA_ID: api1

  api2:
    <<: *api-base
    container_name: atrium-api2
    environment:
      <<: *api-env
      REPLICA_ID: api2

  api3:
    <<: *api-base
    container_name: atrium-api3
    environment:
      <<: *api-env
      REPLICA_ID: api3

  nginx:
    image: nginx:alpine
    container_name: atrium-lb
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [atrium]

  paygate:
    image: atrium-paygate:local
    build:
      context: .
      dockerfile: apps/paygate/Dockerfile
    container_name: atrium-paygate
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PAYGATE_PORT: 9000
      PAYGATE_SECRET: ${PAYGATE_SECRET:-dev-paygate-hmac-secret}
      PAYGATE_CHAOS: ${PAYGATE_CHAOS:-on}
      # The brief's name. P3 shipped Paygate accepting PAYGATE_WEBHOOK_URL as an
      # alias only because this file, owned by another phase, used the wrong
      # one; that alias is now unused here and the brief's spelling wins.
      #
      # Paygate calls back through the load balancer, not a single replica, so
      # a webhook may land on a different replica than the one that charged —
      # which is exactly the case INV-3 has to survive.
      PAYGATE_CALLBACK_URL: ${PAYGATE_CALLBACK_URL:-http://nginx:8080/webhooks/paygate}
      # Without a seed the stack runs on Paygate's default and every chaos
      # branch is unreproducible, which makes a failed run undebuggable.
      PAYGATE_SEED: ${PAYGATE_SEED:-atrium-local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${PAYGATE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [atrium]

  web:
    image: atrium-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: atrium-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [atrium]

volumes:
  atrium-pgdata:

networks:
  atrium:
    driver: bridge
